name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      # --- НОВЫЙ ШАГ: Кэширование Gradle ---
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            \${{ runner.os }}-gradle-
      # --------------------------------------

      - name: Build project (without tests)
        shell: cmd
        # Убрали --no-daemon, он иногда конфликтует с кэшем, но можно оставить, если критично
        run: .\gradlew.bat build -x test

      # Шаг запуска SUT (исправленный, без start /B)
      - name: Start SUT (System Under Test)
        id: start-sut
        shell: cmd
        # ВАЖНО: Если у тебя пакет (package), раскомментируй вторую строку и закомментируй первую
        run: java -cp build\classes\java\main SutServer
        # run: java -cp build\classes\java\main ru.netology.qa.SutServer 

      - name: Wait for SUT to be ready
        if: always() # Ждем даже если сборка прошла странно, но лучше ставить зависимость
        shell: cmd
        run: powershell -NoProfile -Command "$maxTries=60;$try=0;while($try -lt $maxTries) { try { $resp=Invoke-WebRequest -Uri 'http://localhost:9999' -Method Head -TimeoutSec 5 -UseBasicParsing; if ($resp.StatusCode -eq 200) { Write-Host 'SUT is ready.'; exit 0; } } catch { Write-Host 'Waiting for SUT... try ' + $try; } Start-Sleep -Seconds 2; $try++; }; Write-Host 'SUT did not start in time.'; exit 1"

      - name: Run tests
        if: always()
        shell: cmd
        run: .\gradlew.bat test
        env:
          APP_URL: "http://localhost:9999"

      - name: Stop SUT
        if: always()
        shell: cmd
        run: taskkill /F /IM java.exe || echo No java process to kill

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
          retention-days: 7


