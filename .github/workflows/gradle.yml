name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build project (without tests)
        shell: cmd
        run: .\gradlew.bat build -x test --no-daemon

      - name: Start SUT (System Under Test)
        id: start-sut
        shell: cmd
        run: start /B java -cp build\classes\java\main SutServer

      - name: Wait for SUT to be ready
        shell: cmd
        run: |
          powershell -NoProfile -Command ^
            "$maxTries = 60; $try = 0; " ^
            "while ($try -lt $maxTries) { " ^
            "  try { " ^
            "    \$resp = Invoke-WebRequest -Uri 'http://localhost:9999' -Method Head -TimeoutSec 5 -UseBasicParsing; " ^
            "    if (\$resp.StatusCode -eq 200) { Write-Host 'SUT is ready.'; exit 0; } " ^
            "  } catch { Write-Host 'Waiting for SUT... try ' + \$try; } " ^
            "  Start-Sleep -Seconds 2; " ^
            "  \$try++; " ^
            "} " ^
            "Write-Host 'SUT did not start in time.'; exit 1"

      - name: Run tests
        shell: cmd
        run: .\gradlew.bat test --no-daemon
        env:
          APP_URL: "http://localhost:9999"

      - name: Stop SUT
        if: always()
        shell: cmd
        run: taskkill /F /IM java.exe || echo No java process to kill

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/test/
          retention-days: 7
