name: Java CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build --scan
      - name: Start SUT
        run: java -jar ./artifacts/app-order.jar &
      - name: Wait for SUT
        run: sleep 10
      - name: Run tests
        run: ./gradlew test
