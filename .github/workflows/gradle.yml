name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            \${{ runner.os }}-gradle-

      # ЗАПУСК ТВОЕГО СКРИПТА
      - name: Run CI Pipeline Script
        shell: powershell
        # ВАЖНО: Путь должен совпадать с реальным расположением файла!
        # Если файл в корне:
        run: .\run-ci.ps1
        # Если файл в папке 999:
        # run: .\999\run-ci.ps1
        
        env:
          APP_URL: "http://localhost:9999"
