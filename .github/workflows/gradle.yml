
name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      # Кэширование Gradle (ускоряет сборку)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            \${{ runner.os }}-gradle-

      - name: Build project (without tests)
        shell: cmd
        run: .\gradlew.bat build -x test

      # Запуск SUT в фоновом режиме (чтобы пайплайн не завис на этом шаге)
      - name: Start SUT (System Under Test)
        id: start-sut
        shell: cmd
        # Если у тебя есть package (например, package ru.netology.qa;), раскомментируй строку с полным именем класса
        # run: start /B java -cp build\classes\java\main ru.netology.qa.SutServer
        run: start /B java -cp build\classes\java\main SutServer

      # Ожидание готовности SUT (ИСПРАВЛЕНО: GET + диапазон 200-499)
      - name: Wait for SUT to be ready
        shell: cmd
        run: |
          powershell -NoProfile -Command "
            \$maxTries = 60;
            \$try = 0;
            while (\$try -lt \$maxTries) {
              try {
                \$resp = Invoke-WebRequest -Uri 'http://localhost:9999' -Method Get -TimeoutSec 5 -UseBasicParsing -ErrorAction SilentlyContinue;
                if (\$resp.StatusCode -ge 200 -and \$resp.StatusCode -lt 500) {
                  Write-Host 'SUT is ready (Status: ' + \$resp.StatusCode + ')';
                  exit 0;
                }
              } catch {
                Write-Host 'Waiting for SUT... try ' + \$try;
              }
              Start-Sleep -Seconds 2;
              \$try++;
            };
            Write-Host 'SUT did not start in time.';
            exit 1
          "

      - name: Run tests
        shell: cmd
        run: .\gradlew.bat test
        env:
          APP_URL: "http://localhost:9999"

      # Остановка SUT (выполняется всегда, даже если тесты упали)
      - name: Stop SUT
        if: always()
        shell: cmd
        run: taskkill /F /IM java.exe || echo No java process to kill

      # Загрузка отчётов (выполняется всегда)
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
          retention-days: 7
